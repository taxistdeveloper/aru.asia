  <g fill="#ffd166" opacity="0.85">
    <circle cx="215" cy="185" r="12"/>
    <rect x="223" y="128" width="6" height="58" rx="3"/>
    <path d="M223 128 L262 118 L262 132 L223 142 Z"/>
    <circle cx="745" cy="175" r="11"/>
