<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="50%" stop-color="#4c2a6b"/>
      <stop offset="100%" stop-color="#b83b72"/>
    </linearGradient>
    <radialGradient id="spot1" cx="35%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#ff9ebb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff9ebb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="72%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e2e3b"/>
      <stop offset="100%" stop-color="#221324"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <rect width="960" height="720" fill="url(#spot1)"/>
  <rect width="960" height="720" fill="url(#spot2)"/>
